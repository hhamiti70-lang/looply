<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F0B1F">
  <meta name="description" content="LOOPLY - Connect, Discover, Grow. A social network for people who learn and share together.">
  <title>LOOPLY · Connect • Discover • Grow</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <section id="config-missing" class="hidden">
    <div class="card">
      <h2>One setup step left</h2>
      <p>Open <strong>js/config.js</strong> and paste your Supabase Project URL and anon key. The README explains exactly where to find them.</p>
    </div>
  </section>

  <section id="auth-view">
    <div class="auth-card">
      <div class="brand-xl">LOOPLY</div>
      <p class="tagline">CONNECT • DISCOVER • GROW</p>
      <div class="auth-tabs">
        <button id="tab-login" class="tab active" type="button">Log in</button>
        <button id="tab-signup" class="tab" type="button">Sign up</button>
      </div>
      <form id="auth-form" novalidate>
        <div id="signup-only" class="hidden">
          <label>Username
            <input name="username" autocomplete="username" maxlength="20" placeholder="e.g. ada_codes">
          </label>
          <label>Display name
            <input name="display_name" maxlength="40" placeholder="Ada Lovelace">
          </label>
        </div>
        <label>Email
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <label>Password
          <input name="password" type="password" minlength="8" autocomplete="current-password" required>
        </label>
        <button id="auth-submit" class="btn primary block" type="submit">Log in</button>
        <button id="forgot-password" class="btn ghost block" type="button">Forgot password?</button>
        <p id="auth-msg" class="msg" role="alert"></p>
      </form>
    </div>
  </section>

  <section id="reset-view" class="hidden">
    <div class="auth-card">
      <div class="brand-xl">LOOPLY</div>
      <p class="tagline">CREATE A NEW PASSWORD</p>
      <form id="reset-form" novalidate>
        <label>New password
          <input name="new_password" type="password" minlength="8" autocomplete="new-password" required>
        </label>
        <label>Confirm new password
          <input name="confirm_password" type="password" minlength="8" autocomplete="new-password" required>
        </label>
        <button class="btn primary block" type="submit">Save new password</button>
        <p id="reset-msg" class="msg" role="alert"></p>
      </form>
    </div>
  </section>

  <section id="app-view" class="hidden">
    <header class="topbar">
      <div class="brand">LOOPLY</div>
      <button id="logout-btn" class="btn ghost small" type="button">Log out</button>
    </header>
    <main id="main"></main>
    <nav class="bottomnav" aria-label="Main">
      <a href="#feed" data-route="feed">Feed</a>
      <a href="#discover" data-route="discover">Discover</a>
      <a href="#communities" data-route="communities">Groups</a>
      <a href="#messages" data-route="messages">Messages</a>
      <a href="#skills" data-route="skills">Skills</a>
      <a href="#me" data-route="me">Me</a>
    </nav>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
